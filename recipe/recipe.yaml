context:
  name: lerna
  version: "2.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 39cf334c1e2e4510f3b30afc02de236ced7b737a03af314757fc8e1176b98b07

build:
  number: 0
  python:
    version_independent: true
  script:
    - if: unix
      then: export PYO3_PYTHON="$PYTHON"
      else: set "PYO3_PYTHON=%PYTHON%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - hatchling
    - hatch-rs >=0.1.4
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python
    - omegaconf >=2.2.3,<3
    - packaging

tests:
  - python:
      imports:
        - lerna
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - abi3audit
    script:
      - if: unix
        then: abi3audit $SP_DIR/lerna/lerna.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
        else: abi3audit %SP_DIR%/lerna/lerna.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: |
    A high-performance configuration framework for Python applications, built with Rust.
    Lerna is a rewrite of Facebook's Hydra configuration framework.
  homepage: https://github.com/nbprint/lerna
  repository: https://github.com/nbprint/lerna

extra:
  recipe-maintainers:
    - timkpaine
